<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📺 실시간 TV - 모바일</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;
            background:#0a0a0f; color:#fff; min-height:100vh; padding-bottom:70px;
        }
        .header {
            background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);
            padding:14px; text-align:center; position:sticky; top:0; z-index:100;
            border-bottom:1px solid #222;
        }
        .header h1 { font-size:1.15rem; font-weight:800; color:#e94560; letter-spacing:2px; }
        .header .subtitle { font-size:0.65rem; color:#666; margin-top:2px; }

        .category-tabs {
            display:flex; overflow-x:auto; gap:6px; padding:10px 12px;
            background:#0f0f15; position:sticky; top:52px; z-index:99;
            -webkit-overflow-scrolling:touch; scrollbar-width:none;
        }
        .category-tabs::-webkit-scrollbar { display:none; }
        .tab-btn {
            flex-shrink:0; padding:6px 14px; border:1px solid #2a2a3a; border-radius:18px;
            background:#151520; color:#888; font-size:0.78rem; cursor:pointer;
            transition:all 0.2s; white-space:nowrap; font-weight:500;
        }
        .tab-btn.active {
            background:#e94560; color:#fff; border-color:#e94560;
            box-shadow:0 2px 10px rgba(233,69,96,0.3);
        }

        .channel-grid {
            display:grid; grid-template-columns:repeat(2,1fr); gap:10px; padding:12px;
        }
        .channel-card {
            background:#151520; border-radius:14px; overflow:hidden;
            border:1px solid #1e1e2e; transition:transform 0.15s,box-shadow 0.2s;
            cursor:pointer; position:relative;
        }
        .channel-card:active { transform:scale(0.96); }
        .channel-card:hover { box-shadow:0 4px 20px rgba(233,69,96,0.12); border-color:#2a2a40; }

        .channel-thumb {
            width:100%; aspect-ratio:16/9; background:#1a1a28;
            display:flex; align-items:center; justify-content:center;
            position:relative; overflow:hidden;
        }
        .channel-thumb img {
            width:100%; height:100%; object-fit:cover; opacity:0.9;
        }
        .logo-fallback {
            font-size:1.3rem; font-weight:800; color:#e94560;
            text-shadow:0 2px 8px rgba(233,69,96,0.3);
        }
        .play-icon {
            position:absolute; width:44px; height:44px;
            background:rgba(233,69,96,0.92); border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:14px; color:#fff; opacity:0.85;
            transition:all 0.2s; box-shadow:0 2px 12px rgba(0,0,0,0.3);
        }
        .channel-card:hover .play-icon { transform:scale(1.1); opacity:1; }

        .channel-info { padding:10px 12px; }
        .channel-name { font-size:0.85rem; font-weight:700; color:#fff;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .channel-category { font-size:0.68rem; color:#e94560; margin-top:3px; font-weight:500; }

        .live-badge {
            position:absolute; top:8px; left:8px; background:#ff3333; color:#fff;
            font-size:0.6rem; font-weight:800; padding:3px 7px; border-radius:4px;
            display:flex; align-items:center; gap:3px; animation:pulse 2s infinite;
            letter-spacing:0.5px;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.65} }
        .live-badge::before { content:''; width:5px; height:5px; background:#fff; border-radius:50%; }

        .yt-badge {
            position:absolute; top:8px; right:8px; background:#ff0000; color:#fff;
            font-size:0.6rem; font-weight:800; padding:3px 6px; border-radius:4px;
        }
        .kbs-badge {
            position:absolute; top:8px; right:8px; background:#0066cc; color:#fff;
            font-size:0.6rem; font-weight:800; padding:3px 6px; border-radius:4px;
        }

        .player-modal {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:#000; z-index:1000; flex-direction:column;
        }
        .player-modal.active { display:flex; }
        .player-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:10px 14px; background:#111118; border-bottom:1px solid #222;
        }
        .player-header .channel-title {
            font-size:0.95rem; font-weight:700; display:flex; align-items:center; gap:8px;
        }
        .player-header .live-dot {
            width:8px; height:8px; background:#ff3333; border-radius:50%;
            animation:pulse 2s infinite;
        }
        .close-btn {
            width:34px; height:34px; border:none; background:#2a2a3a; color:#fff;
            border-radius:50%; font-size:1rem; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
        }
        .close-btn:active { background:#e94560; }

        .player-container {
            flex:1; display:flex; align-items:center; justify-content:center;
            background:#000; position:relative;
        }
        .player-container video, .player-container iframe {
            width:100%; height:100%; border:none;
        }
        .player-loading {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            text-align:center; z-index:10;
        }
        .player-loading .spinner {
            width:48px; height:48px; border:3px solid #222;
            border-top-color:#e94560; border-radius:50%;
            animation:spin 0.8s linear infinite; margin:0 auto 12px;
        }
        @keyframes spin { to{transform:rotate(360deg)} }
        .player-loading p { color:#888; font-size:0.85rem; }

        .error-msg {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            text-align:center; color:#888; z-index:10; padding:20px;
        }
        .error-msg .icon { font-size:3rem; margin-bottom:10px; }
        .error-msg p { font-size:0.85rem; line-height:1.5; }

        .player-controls-bar {
            padding:12px 16px; background:#111118;
            display:flex; justify-content:center; gap:10px;
            border-top:1px solid #222;
        }
        .control-btn {
            padding:10px 20px; border:none; border-radius:10px;
            background:#e94560; color:#fff; font-size:0.85rem;
            font-weight:600; cursor:pointer; flex:1; max-width:160px;
            transition:opacity 0.2s; display:flex; align-items:center;
            justify-content:center; gap:5px;
        }
        .control-btn:active { opacity:0.8; }
        .control-btn.secondary { background:#2a2a3a; }

        .bottom-nav {
            position:fixed; bottom:0; left:0; width:100%; background:#111118;
            border-top:1px solid #1e1e2e; display:flex; justify-content:space-around;
            padding:6px 0 10px; z-index:100; backdrop-filter:blur(10px);
        }
        .nav-item {
            display:flex; flex-direction:column; align-items:center; gap:2px;
            padding:4px 12px; color:#555; font-size:0.65rem;
            text-decoration:none; cursor:pointer; transition:color 0.2s;
            border:none; background:none;
        }
        .nav-item.active { color:#e94560; }
        .nav-item .icon { font-size:1.3rem; }

        .toast {
            position:fixed; bottom:90px; left:50%;
            transform:translateX(-50%) translateY(100px);
            background:#2a2a3a; color:#fff; padding:10px 20px;
            border-radius:10px; font-size:0.8rem; z-index:2000;
            opacity:0; transition:all 0.3s; pointer-events:none;
            box-shadow:0 4px 20px rgba(0,0,0,0.4);
        }
        .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

        .search-box {
            padding:10px 12px; background:#0f0f15;
            position:sticky; top:96px; z-index:98;
        }
        .search-box input {
            width:100%; padding:10px 16px; border-radius:10px;
            border:1px solid #2a2a3a; background:#151520; color:#fff;
            font-size:0.9rem; outline:none;
        }

</head>
<body>

<header class="header">

    <button class="tab-btn" data-category="KBS">KBS 계열</button>
    <button class="tab-btn" data-category="종합편성">종합편성</button>
    <button class="tab-btn" data-category="뉴스">뉴스</button>
    <button class="tab-btn" data-category="스포츠">스포츠</button>
    <button class="tab-btn" data-category="영화">영화/드라마</button>
    <button class="tab-btn" data-category="해외">해외</button>
    <button class="tab-btn" data-category="기타">기타/종교</button>
</div>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 채널 검색..." oninput="searchChannels(this.value)">
</div>

<div class="channel-grid" id="channelGrid">
    <div class="player-loading" style="grid-column:1/-1;padding:40px;">
        <div class="spinner"></div>
        <p>채널 목록 로딩 중...</p>
    </div>
</div>

<!-- 플레이어 모달 -->
<div class="player-modal" id="playerModal">
    <div class="player-header">
        <span class="channel-title">
            <span class="live-dot"></span>
            <span id="playerTitle">채널명</span>
        </span>
        <button class="close-btn" onclick="closePlayer()">✕</button>
    </div>
    <div class="player-container" id="playerContainer">
        <video id="videoPlayer" controls playsinline style="display:none;"></video>
        <iframe id="ytPlayer" style="display:none;" allowfullscreen
            allow="autoplay; encrypted-media; picture-in-picture"
            sandbox="allow-scripts allow-same-origin allow-popups allow-presentation">
        </iframe>
        <div class="player-loading" id="playerLoading">
            <div class="spinner"></div>
            <p>스트림 로딩 중...</p>
        </div>
        <div class="error-msg" id="playerError" style="display:none;">
            <div class="icon">⚠️</div>
            <p id="errorText">재생할 수 없습니다.</p>
        </div>
    </div>
    <div class="player-controls-bar">
        <button class="control-btn secondary" onclick="copyUrl()">📋 URL 복사</button>
        <button class="control-btn" onclick="openExternal()">🌐 외부 재생</button>
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="filterCategory('all')">
        <span class="icon">🏠</span><span>홈</span>
    </button>
    <button class="nav-item" onclick="filterCategory('지상파')">

    </button>

    <button class="nav-item" onclick="filterCategory('스포츠')">

</nav>

<div class="toast" id="toast"></div>

function renderChannels(category = 'all', query = '') {
    const grid = document.getElementById('channelGrid');
    let filtered = channels;

    if (category !== 'all') {
        filtered = filtered.filter(ch => ch.category === category);
    }

    if (query) {
        const q = query.toLowerCase();
        filtered = filtered.filter(ch => ch.name.toLowerCase().includes(q));
    }

    if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#555;"><div style="font-size:3rem;margin-bottom:12px;">📭</div><p>검색 결과가 없습니다.</p></div>`;
        return;
    }

    grid.innerHTML = filtered.map(ch => {
        const badge = ch.type === 'youtube' ? `<div class="yt-badge">YT</div>`
            : ch.type === 'kbs' ? `<div class="kbs-badge">KBS</div>`
            : `<div class="live-badge">LIVE</div>`;

        return `
        <div class="channel-card" onclick="playChannel('${ch.name}', '${ch.type}', '${ch.code || ''}', '${ch.url || ''}', '${ch.apiUrl || ''}')">
            <div class="channel-thumb">
                <div class="logo-fallback">${ch.name.substring(0,3)}</div>
                ${badge}
                <div class="play-icon">▶</div>
            </div>
            <div class="channel-info">
                <div class="channel-name">${ch.name}</div>
                <div class="channel-category">${ch.category}</div>
            </div>
        </div>`;
    }).join('');
}

function searchChannels(query) {
    searchQuery = query;
    renderChannels(currentCategory, query);
}

// ============================================
// 카테고리 필터링
// ============================================
function filterCategory(category) {
    currentCategory = category;
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.category === category);
    });
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    if (event && event.target) {
        event.target.closest('.nav-item')?.classList.add('active');
    }
    renderChannels(category, searchQuery);
}

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => filterCategory(btn.dataset.category));
});

// ============================================
// 채널 재생
// ============================================
async function playChannel(name, type, code, url, apiUrl) {
    currentType = type;
    document.getElementById('playerTitle').textContent = name;

    const video = document.getElementById('videoPlayer');
    const ytPlayer = document.getElementById('ytPlayer');
    const loading = document.getElementById('playerLoading');
    const errorDiv = document.getElementById('playerError');

    if (currentHls) { currentHls.destroy(); currentHls = null; }
    video.pause(); video.src = ''; video.style.display = 'none';
    ytPlayer.src = ''; ytPlayer.style.display = 'none';
    loading.style.display = 'block';
    errorDiv.style.display = 'none';

    document.getElementById('playerModal').classList.add('active');
    document.body.style.overflow = 'hidden';

    if (type === 'kbs') {
        try {
            const m3u8Url = await fetchKbsStream(apiUrl, code);
            currentUrl = m3u8Url || apiUrl;
            if (!m3u8Url) throw new Error('KBS API 실패');
            video.style.display = 'block';
            playHls(m3u8Url, video, loading, errorDiv);
        } catch (err) {
            loading.style.display = 'none';
            errorDiv.style.display = 'block';
            document.getElementById('errorText').innerHTML =
                'KBS 스트림을 불러올 수 없습니다.<br>' +
                'CORS 제한으로 인해 직접 접근이 불가능합니다.<br>' +
                '외부 재생 버튼을 눌러 VLC로 시도해보세요.';
        }
    }
    else if (type === 'youtube') {
        currentUrl = url;
        loading.style.display = 'none';
        ytPlayer.style.display = 'block';
        ytPlayer.src = url;
    }
    else {
        // iframe으로 원본 사이트 플레이어 로드
        currentUrl = url;
        loading.style.display = 'none';
        ytPlayer.style.display = 'block';
        ytPlayer.sandbox = 'allow-scripts allow-same-origin allow-popups allow-presentation';
        ytPlayer.src = url;
    }
}

async function fetchKbsStream(apiUrl, code) {
    try {
        const proxyList = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?',
        ];
        for (const proxy of proxyList) {
            try {
                const res = await fetch(proxy + apiUrl, { headers: { 'Accept': 'application/json' } });
                if (!res.ok) continue;
                const data = await res.json();
                if (data.ret === 0 && data.channel_item) {
                    const tvStream = data.channel_item.find(item => item.media_type === 'tv');
                    if (tvStream && tvStream.service_url) return tvStream.service_url;
                }
            } catch (e) { continue; }
        }
    } catch (e) { console.error('KBS API Error:', e); }
    return null;
}

function playHls(url, video, loading, errorDiv) {
    if (Hls.isSupported()) {
        currentHls = new Hls({
            maxBufferLength: 30, maxMaxBufferLength: 60,
            liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 10,
            enableWorker: true,
        });
        currentHls.loadSource(url);
        currentHls.attachMedia(video);
        currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
            loading.style.display = 'none';
            video.play().catch(e => console.log('Autoplay blocked:', e));
        });
        currentHls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
                loading.style.display = 'none';
                errorDiv.style.display = 'block';
                document.getElementById('errorText').textContent = 'HLS 오류: ' + (data.details || 'Unknown');
            }
        });
    }
    else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
            loading.style.display = 'none';
            video.play().catch(e => console.log('Autoplay blocked:', e));
        });
        video.addEventListener('error', () => {
            loading.style.display = 'none';
            errorDiv.style.display = 'block';
        });
    }
    else {
        loading.style.display = 'none';
        errorDiv.style.display = 'block';
        document.getElementById('errorText').textContent = 'HLS 미지원 브라우저입니다.';
    }
}

function closePlayer() {
    const video = document.getElementById('videoPlayer');
    const ytPlayer = document.getElementById('ytPlayer');
    if (currentHls) { currentHls.destroy(); currentHls = null; }
    video.pause(); video.src = ''; video.load(); video.style.display = 'none';
    ytPlayer.src = ''; ytPlayer.style.display = 'none';
    document.getElementById('playerModal').classList.remove('active');
    document.body.style.overflow = '';
}

function openExternal() {
    window.open(currentUrl, '_blank');
}

function copyUrl() {
    navigator.clipboard.writeText(currentUrl).then(() => {
        showToast('📋 URL이 복사되었습니다!');
    }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = currentUrl; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('📋 URL이 복사되었습니다!');
    });
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg; toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

// 초기화
renderChannels();

window.addEventListener('popstate', () => {
    if (document.getElementById('playerModal').classList.contains('active')) {
        closePlayer();
    }
});
</script>
