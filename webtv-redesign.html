  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  <style>
    :root {
      --bg:         #0c0a04;
      --surface:    #141108;
      --surface2:   #1e1a0e;
      --border:     rgba(255,220,80,0.08);
      --accent:     #f59e0b;
      --accent2:    #fcd34d;
      --accent-glow:rgba(245,158,11,0.25);
      --red:        #ef4444;
      --text:       #fef3c7;
      --muted:      #92816a;
      --radius:     14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 40% at 80% 10%, rgba(245,158,11,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 30% at 10% 80%, rgba(252,211,77,0.07) 0%, transparent 55%);
      pointer-events: none;
    }
    header {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(20px) saturate(180%);
      background: rgba(12,10,4,0.88);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex; align-items: center; gap: 20px;
      height: 64px;
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px; letter-spacing: 3px;
      color: #fff;
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; flex-shrink: 0;
    }
    .logo-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 10px var(--red), 0 0 20px rgba(239,68,68,0.5);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .nav-btn {
      padding: 7px 16px; border-radius: 8px;
      border: 1px solid transparent; background: transparent;
      color: var(--muted); font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: all .2s; text-decoration: none;
    }
    .nav-btn:hover { background: var(--surface2); border-color: var(--border); color: var(--text); }
    .nav-btn.active { background: var(--surface2); border-color: rgba(245,158,11,0.4); color: var(--accent); }
    .sync-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--muted); font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px; cursor: pointer; transition: all .2s; flex-shrink: 0;
    }
    .sync-btn:hover { color: var(--accent2); border-color: rgba(252,211,77,0.4); }
    .sync-btn svg { transition: transform .4s; }
    .sync-btn.loading svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    main { position: relative; z-index: 1; padding: 20px 24px; }
    .tabs {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 18px;
    }
    .tab {
      padding: 5px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); font-family: 'Noto Sans KR', sans-serif;
      font-size: 12px; cursor: pointer; transition: all .2s;
    }
    .tab:hover { background: var(--surface); color: var(--text); }
    .tab.active {
      background: var(--accent); border-color: var(--accent);
      color: #000; font-weight: 700;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }
    .channel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      cursor: pointer; transition: all .25s cubic-bezier(.4,0,.2,1);
      text-decoration: none; color: inherit;
      display: flex; flex-direction: row; align-items: center; gap: 10px;
      position: relative; overflow: hidden;
      animation: fadeUp .3s ease both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .channel-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      opacity: 0; transition: opacity .25s;
    }
    .channel-card:hover {
      background: var(--surface2);
      border-color: rgba(245,158,11,0.3);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.4), 0 0 0 1px rgba(245,158,11,0.1);
    }
    .channel-card:hover::before { opacity: 1; }
    .card-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; overflow: hidden;
    }
    .card-icon img {

}

function renderGrid(gridId, channels, filter) {
  var grid = document.getElementById(gridId);
  var list = filter === 'all' ? channels : channels.filter(function(c){ return c.cat === filter; });
  if (!list.length) {
    grid.innerHTML = '<div class="state-box"><p>해당 카테고리 채널이 없습니다.</p></div>';
    return;
  }
  grid.innerHTML = '';
  list.forEach(function(ch, i) {
    var card = document.createElement('div');
    card.className = 'channel-card';
    card.style.animationDelay = (i * 20) + 'ms';
    var iconHtml = ch.logo
      ? '<img src="' + ch.logo + '" alt="' + escHtml(ch.name) + '" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'' + (ch.icon||'📺') + '\'">'
      : (ch.icon || '📺');
    card.innerHTML =
      '<div class="card-icon">' + iconHtml + '</div>' +
      '<div><div class="card-name">' + escHtml(ch.name) + '</div>' +
      '<div class="card-type">' + ch.cat + '</div></div>';
    (function(c){
      card.addEventListener('click', function(){
        if (c.fn) c.fn();
        else if (c.url) window.open(c.url, '_blank');
      });
    })(ch);
    grid.appendChild(card);
  });
}

function filterCat(cat, btn) {
  document.querySelectorAll('#tvTabs .tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  currentCat = cat;
  renderGrid('tvGrid', TV_CHANNELS, cat);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('syncBtn').addEventListener('click', function(){
  var btn = this;
  btn.classList.add('loading');
  document.getElementById('syncLabel').textContent = '로딩 중…';
  renderGrid('tvGrid', TV_CHANNELS, currentCat);
  setTimeout(function(){
    btn.classList.remove('loading');
    document.getElementById('syncLabel').textContent = '새로고침';
    document.getElementById('lastUpdated').textContent = '마지막 갱신: ' + new Date().toLocaleTimeString('ko-KR');
  }, 500);
});

// 초기 로드
renderGrid('tvGrid', TV_CHANNELS, 'all');
</script>
</body>
